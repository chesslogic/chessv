<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>PROTOTYPE — Ordered Progressive successor</title>
  <!-- Three UI concepts for a 6x8-start Ordered Progressive successor, switchable with ?variant=A|B|C. -->
  <style>
    :root {
      --ink: #19221d;
      --muted: #68736c;
      --paper: #f4f0e7;
      --surface: #fffdf7;
      --line: #d8d4c8;
      --accent: #e55c33;
      --accent-2: #174d3a;
      --light-square: #e8dec5;
      --dark-square: #76917a;
      --shadow: 0 18px 50px rgba(25, 34, 29, 0.12);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--paper);
    }

    button {
      font: inherit;
    }

    code,
    .mono {
      font-family: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }

    .variant {
      min-height: 100vh;
      padding-bottom: 118px;
    }

    .prototype-flag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .prototype-flag::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    h1 {
      letter-spacing: -0.045em;
    }

    .eyebrow {
      margin-bottom: 10px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 850;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .board-figure {
      margin: 0;
      width: min(100%, 472px);
    }

    .board-coordinates {
      width: 100%;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .file-row {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      margin: 0 24px;
      text-align: center;
    }

    .file-row span {
      padding: 5px 0;
    }

    .board-line {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) 24px;
      align-items: stretch;
    }

    .rank-column {
      display: grid;
      grid-template-rows: repeat(8, 1fr);
      align-items: center;
      justify-items: center;
    }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      aspect-ratio: 6 / 8;
      overflow: hidden;
      border: 1px solid rgba(25, 34, 29, 0.26);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .square {
      position: relative;
      display: grid;
      place-items: center;
      aspect-ratio: 1;
    }

    .square.light {
      background: var(--light-square);
    }

    .square.dark {
      background: var(--dark-square);
    }

    .piece {
      position: relative;
      z-index: 1;
      font-family: "Segoe UI Symbol", "Arial Unicode MS", sans-serif;
      font-size: clamp(29px, 7.4vw, 54px);
      line-height: 1;
      transform: translateY(-1px);
    }

    .piece.white {
      color: #fffdf7;
      text-shadow:
        -1px -1px 0 #1c261f,
        1px -1px 0 #1c261f,
        -1px 1px 0 #1c261f,
        1px 1px 0 #1c261f,
        0 3px 8px rgba(0, 0, 0, 0.26);
    }

    .piece.black {
      color: #19221d;
      text-shadow: 0 2px 5px rgba(255, 255, 255, 0.24);
    }

    .board-caption {
      display: grid;
      gap: 12px;
      margin: 14px 24px 0;
    }

    .fen-readout {
      overflow-wrap: anywhere;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: color-mix(in srgb, var(--surface) 86%, transparent);
      font-size: 12px;
      line-height: 1.5;
    }

    .fen-readout strong {
      display: block;
      margin-bottom: 4px;
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .formation-note {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 11px;
    }

    .inventory {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin: 0;
    }

    .inventory div {
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: color-mix(in srgb, var(--surface) 78%, transparent);
    }

    .inventory dt {
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .inventory dd {
      margin: 3px 0 0;
      font-size: 13px;
      font-weight: 800;
    }

    .switcher {
      position: fixed;
      z-index: 50;
      bottom: 22px;
      left: 50%;
      display: grid;
      grid-template-columns: 42px minmax(190px, auto) 42px;
      align-items: center;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: #111714;
      box-shadow: 0 14px 44px rgba(0, 0, 0, 0.34);
      color: #fff;
      transform: translateX(-50%);
    }

    .switcher button {
      width: 42px;
      height: 42px;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font-size: 19px;
    }

    .switcher button:hover,
    .switcher button:focus-visible {
      background: #2b3730;
      outline: none;
    }

    .switcher-label {
      padding: 0 12px;
      font-size: 12px;
      font-weight: 750;
      text-align: center;
      white-space: nowrap;
    }

    .switcher-label small {
      color: #9fa9a3;
      font-weight: 500;
    }

    /* Variant A: a conservative addition to the existing goal picker. */
    .variant-a {
      background:
        radial-gradient(circle at 85% 0%, rgba(229, 92, 51, 0.12), transparent 30%),
        var(--paper);
    }

    .a-shell {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding-top: 34px;
    }

    .a-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 28px;
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }

    .a-header h1 {
      max-width: 760px;
      margin-bottom: 0;
      font-size: clamp(36px, 6vw, 74px);
      line-height: 0.97;
    }

    .a-header p {
      max-width: 320px;
      margin-bottom: 3px;
      color: var(--muted);
      line-height: 1.55;
    }

    .a-workspace {
      display: grid;
      grid-template-columns: minmax(320px, 0.9fr) minmax(360px, 1.1fr);
      gap: 48px;
      align-items: start;
      padding: 44px 0;
    }

    .settings-panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      box-shadow: 0 16px 45px rgba(32, 38, 34, 0.06);
    }

    .settings-head {
      padding: 22px 24px 16px;
      border-bottom: 1px solid var(--line);
    }

    .settings-head h2 {
      margin-bottom: 5px;
      font-size: 20px;
    }

    .settings-head p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .goal-option {
      display: grid;
      grid-template-columns: 22px 1fr auto;
      gap: 12px;
      align-items: start;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
    }

    .goal-option.selected {
      background: #eef4ee;
      box-shadow: inset 4px 0 var(--accent-2);
    }

    .radio {
      display: grid;
      width: 18px;
      height: 18px;
      margin-top: 2px;
      place-items: center;
      border: 2px solid #87928b;
      border-radius: 50%;
    }

    .selected .radio {
      border-color: var(--accent-2);
    }

    .selected .radio::after {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-2);
      content: "";
    }

    .goal-option strong,
    .goal-option small {
      display: block;
    }

    .goal-option small {
      margin-top: 5px;
      color: var(--muted);
      line-height: 1.4;
    }

    .ordinal {
      padding: 5px 7px;
      border-radius: 5px;
      background: #e5e7e3;
      font-size: 11px;
      font-weight: 800;
    }

    .settings-note {
      margin: 18px 24px 24px;
      padding: 15px;
      border-left: 3px solid var(--accent);
      background: #fff2eb;
      font-size: 13px;
      line-height: 1.5;
    }

    .a-board-wrap {
      display: grid;
      justify-items: center;
    }

    .stage-section,
    .risk-section {
      padding: 30px 0;
      border-top: 1px solid var(--line);
    }

    .stage-strip {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-top: 20px;
    }

    .stage-card {
      position: relative;
      min-height: 104px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--surface);
    }

    .stage-card:first-child {
      border-color: var(--accent);
      background: #fff2eb;
    }

    .stage-number {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .stage-card strong {
      display: block;
      margin-top: 16px;
      font-size: 20px;
    }

    .stage-card small {
      color: var(--muted);
    }

    .risk-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      margin-top: 18px;
    }

    .risk-card {
      padding: 19px;
      border: 1px solid #e1c3b8;
      border-radius: 10px;
      background: #fff9f5;
    }

    .risk-card strong {
      display: block;
      margin-bottom: 7px;
    }

    .risk-card p {
      margin: 0;
      color: #695c56;
      font-size: 13px;
      line-height: 1.5;
    }

    /* Variant B: an explicit experiment console with a control group. */
    .variant-b {
      --ink: #e9f0ea;
      --muted: #94a69b;
      --paper: #08120e;
      --surface: #0f1c16;
      --line: #2b4135;
      --accent: #b7f34b;
      --accent-2: #f3a94b;
      --light-square: #d6d4bd;
      --dark-square: #4a745d;
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
      background:
        linear-gradient(rgba(183, 243, 75, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(183, 243, 75, 0.035) 1px, transparent 1px),
        var(--paper);
      background-size: 32px 32px;
    }

    .b-shell {
      width: min(1320px, calc(100% - 42px));
      margin: 0 auto;
      padding-top: 24px;
    }

    .b-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    .b-topbar .prototype-flag {
      color: var(--accent);
    }

    .b-control {
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0a1510;
      font-size: 11px;
    }

    .b-control span {
      padding: 7px 10px;
      border-radius: 5px;
      color: var(--muted);
    }

    .b-control .active {
      background: var(--accent);
      color: #14200f;
      font-weight: 850;
    }

    .b-hero {
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(270px, 0.75fr);
      gap: 44px;
      padding: 46px 0 34px;
    }

    .b-hero h1 {
      max-width: 850px;
      margin-bottom: 20px;
      font-size: clamp(48px, 8.5vw, 112px);
      line-height: 0.84;
      text-transform: uppercase;
    }

    .b-hero h1 em {
      color: var(--accent);
      font-style: normal;
    }

    .b-hypothesis {
      align-self: end;
      padding: 18px 0 5px 22px;
      border-left: 2px solid var(--accent);
    }

    .b-hypothesis strong {
      display: block;
      margin-bottom: 8px;
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .b-hypothesis p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .lab-grid {
      display: grid;
      grid-template-columns: minmax(360px, 1fr) minmax(320px, 0.75fr);
      gap: 44px;
      align-items: start;
      padding: 30px 0;
      border-top: 1px solid var(--line);
    }

    .lab-board {
      display: grid;
      justify-items: center;
      padding: 26px;
      border: 1px solid var(--line);
      background: rgba(8, 18, 14, 0.84);
    }

    .variant-b .fen-readout,
    .variant-b .inventory div {
      background: #0f1c16;
    }

    .lab-readouts {
      display: grid;
      gap: 18px;
    }

    .readout {
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .readout:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .readout-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .readout-value {
      color: var(--accent);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: clamp(18px, 2.6vw, 31px);
      overflow-wrap: anywhere;
    }

    .control-group {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 13px;
      align-items: center;
      padding: 15px;
      border: 1px solid #526459;
      background: #17241d;
    }

    .control-tag {
      padding: 5px 7px;
      border: 1px solid currentColor;
      color: var(--accent-2);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .control-group small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
    }

    .b-stage-title {
      margin: 28px 0 15px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .stage-ladder {
      counter-reset: stages;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .stage-ladder li {
      position: relative;
      display: grid;
      grid-template-columns: 38px 1fr auto;
      gap: 12px;
      align-items: center;
      min-height: 58px;
      border-top: 1px solid var(--line);
      counter-increment: stages;
    }

    .stage-ladder li::before {
      color: var(--muted);
      content: "0" counter(stages);
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 11px;
    }

    .stage-ladder strong {
      font-size: 21px;
    }

    .stage-ladder span {
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .stage-ladder li:first-child strong,
    .stage-ladder li:first-child span {
      color: var(--accent);
    }

    .b-risks {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 35px;
      padding: 31px 0 46px;
      border-top: 1px solid var(--line);
    }

    .b-risks h2 {
      color: var(--accent-2);
      font-size: 14px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .risk-log {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .risk-log article {
      padding-left: 17px;
      border-left: 2px solid var(--accent-2);
    }

    .risk-log strong {
      display: block;
      margin-bottom: 7px;
    }

    .risk-log p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    /* Variant C: a migration map that names stable and next-generation lanes. */
    .variant-c {
      --ink: #211c38;
      --muted: #706987;
      --paper: #f6f2ff;
      --surface: #ffffff;
      --line: #dcd4ef;
      --accent: #6135d1;
      --accent-2: #ff7043;
      --light-square: #eee8fa;
      --dark-square: #7460a5;
      background:
        radial-gradient(circle at 12% 15%, #efe4ff, transparent 28%),
        radial-gradient(circle at 94% 40%, #ffe9df, transparent 24%),
        var(--paper);
    }

    .c-shell {
      width: min(1240px, calc(100% - 42px));
      margin: 0 auto;
      padding-top: 34px;
    }

    .c-header {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(260px, 0.6fr);
      gap: 48px;
      align-items: end;
      padding-bottom: 40px;
    }

    .c-header h1 {
      margin: 17px 0 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(50px, 8vw, 105px);
      font-weight: 500;
      line-height: 0.9;
    }

    .c-header p {
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
    }

    .lane-compare {
      display: grid;
      grid-template-columns: 0.78fr 1.22fr;
      gap: 14px;
    }

    .lane {
      position: relative;
      min-height: 220px;
      padding: 25px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.74);
    }

    .lane.next {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 24px 80px rgba(97, 53, 209, 0.14);
    }

    .lane-label {
      display: inline-block;
      padding: 6px 9px;
      border-radius: 999px;
      background: #eee8fa;
      color: var(--accent);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .lane h2 {
      max-width: 650px;
      margin: 35px 0 8px;
      font-size: clamp(25px, 3.7vw, 48px);
      letter-spacing: -0.035em;
      line-height: 1;
    }

    .lane code {
      color: var(--muted);
      font-size: 13px;
    }

    .lane p {
      max-width: 610px;
      margin: 16px 0 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .lane .ordinal-orb {
      position: absolute;
      top: 20px;
      right: 24px;
      color: color-mix(in srgb, var(--accent) 17%, transparent);
      font-family: Georgia, serif;
      font-size: 92px;
      line-height: 1;
    }

    .journey {
      margin: 48px 0;
    }

    .journey-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .journey-head h2 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 34px;
      font-weight: 500;
    }

    .journey-head p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .journey-map {
      display: grid;
      grid-template-columns: 1.35fr repeat(5, 1fr);
      align-items: stretch;
      gap: 8px;
    }

    .journey-node {
      position: relative;
      min-height: 128px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.72);
    }

    .journey-node.start {
      border-color: var(--accent-2);
      background: #fff5f0;
    }

    .journey-node:not(:last-child)::after {
      position: absolute;
      z-index: 2;
      top: 50%;
      right: -10px;
      width: 12px;
      height: 12px;
      border-top: 2px solid var(--muted);
      border-right: 2px solid var(--muted);
      content: "";
      transform: translateY(-50%) rotate(45deg);
    }

    .journey-node small {
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .journey-node strong {
      display: block;
      margin-top: 30px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(23px, 3vw, 38px);
      font-weight: 500;
    }

    .c-dossier {
      display: grid;
      grid-template-columns: minmax(340px, 0.92fr) minmax(360px, 1.08fr);
      gap: 55px;
      align-items: start;
      padding: 44px 0;
      border-top: 1px solid var(--line);
    }

    .c-board {
      display: grid;
      justify-items: center;
    }

    .dossier-copy h2 {
      margin-bottom: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 39px;
      font-weight: 500;
    }

    .dossier-copy > p {
      color: var(--muted);
      line-height: 1.55;
    }

    .config-table {
      margin: 27px 0;
      border-top: 1px solid var(--line);
    }

    .config-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 22px;
      padding: 15px 0;
      border-bottom: 1px solid var(--line);
    }

    .config-row span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      text-transform: uppercase;
    }

    .config-row strong,
    .config-row code {
      overflow-wrap: anywhere;
    }

    .c-risk-list {
      display: grid;
      gap: 10px;
    }

    .c-risk {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 10px;
      padding: 14px;
      border-radius: 10px;
      background: #fff3ed;
    }

    .c-risk b {
      display: grid;
      width: 25px;
      height: 25px;
      place-items: center;
      border-radius: 50%;
      background: var(--accent-2);
      color: #fff;
      font-size: 12px;
    }

    .c-risk strong {
      display: block;
      margin-bottom: 4px;
    }

    .c-risk p {
      margin: 0;
      color: #75645e;
      font-size: 13px;
      line-height: 1.45;
    }

    @media (max-width: 820px) {
      .a-header,
      .c-header {
        display: grid;
        grid-template-columns: 1fr;
      }

      .a-workspace,
      .lab-grid,
      .c-dossier {
        grid-template-columns: 1fr;
      }

      .a-header {
        align-items: start;
      }

      .stage-strip,
      .journey-map {
        grid-template-columns: repeat(2, 1fr);
      }

      .journey-node:not(:last-child)::after {
        display: none;
      }

      .b-hero {
        grid-template-columns: 1fr;
      }

      .b-hypothesis {
        align-self: auto;
      }

      .lane-compare {
        grid-template-columns: 1fr;
      }

      .risk-grid,
      .risk-log {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 540px) {
      .a-shell,
      .b-shell,
      .c-shell {
        width: min(100% - 24px, 1240px);
      }

      .a-header h1 {
        font-size: 42px;
      }

      .a-workspace {
        gap: 30px;
        padding-top: 28px;
      }

      .stage-strip,
      .journey-map {
        grid-template-columns: 1fr 1fr;
      }

      .b-topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .b-control {
        width: 100%;
      }

      .b-control span {
        flex: 1;
        text-align: center;
      }

      .b-hero h1 {
        font-size: 54px;
      }

      .lab-board {
        padding: 12px 4px 18px;
      }

      .b-risks {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .c-header h1 {
        font-size: 53px;
      }

      .lane {
        min-height: 190px;
      }

      .config-row {
        grid-template-columns: 1fr;
        gap: 5px;
      }

      .switcher {
        grid-template-columns: 42px minmax(178px, auto) 42px;
      }
    }
  </style>
</head>
<body>
  <main id="app"></main>

  <nav class="switcher" aria-label="Prototype concept switcher">
    <button type="button" data-delta="-1" aria-label="Previous concept">←</button>
    <div class="switcher-label" id="switcher-label" aria-live="polite"></div>
    <button type="button" data-delta="1" aria-label="Next concept">→</button>
  </nav>

  <script>
    const FEN = "nbrkbn/pppppp/6/6/6/6/PPPPPP/NBRKBN";
    const STAGES = ["6×8", "8×8", "10×8", "10×10", "12×10", "12×12"];
    const FILES = ["a", "b", "c", "d", "e", "f"];
    const RANKS = ["8", "7", "6", "5", "4", "3", "2", "1"];
    const POSITION = [
      ["n", "b", "r", "k", "b", "n"],
      ["p", "p", "p", "p", "p", "p"],
      ["", "", "", "", "", ""],
      ["", "", "", "", "", ""],
      ["", "", "", "", "", ""],
      ["", "", "", "", "", ""],
      ["P", "P", "P", "P", "P", "P"],
      ["N", "B", "R", "K", "B", "N"]
    ];
    const GLYPHS = {
      K: "♔", R: "♖", B: "♗", N: "♘", P: "♙",
      k: "♚", r: "♜", b: "♝", n: "♞", p: "♟"
    };
    const NAMES = {
      K: "white king", R: "white rook", B: "white bishop", N: "white knight", P: "white pawn",
      k: "black king", r: "black rook", b: "black bishop", n: "black knight", p: "black pawn"
    };

    function boardMarkup() {
      const squares = POSITION.flatMap((rank, row) =>
        rank.map((piece, col) => {
          const tone = (row + col) % 2 === 0 ? "light" : "dark";
          const side = piece && piece === piece.toUpperCase() ? "white" : "black";
          const coordinate = `${FILES[col]}${RANKS[row]}`;
          const content = piece
            ? `<span class="piece ${side}" aria-label="${NAMES[piece]} on ${coordinate}">${GLYPHS[piece]}</span>`
            : "";
          return `<div class="square ${tone}" title="${coordinate}">${content}</div>`;
        })
      ).join("");

      const fileLabels = FILES.map(file => `<span>${file}</span>`).join("");
      const rankLabels = RANKS.map(rank => `<span>${rank}</span>`).join("");

      return `
        <figure class="board-figure" aria-label="Six-file by eight-rank chessboard">
          <div class="board-coordinates">
            <div class="file-row" aria-hidden="true">${fileLabels}</div>
            <div class="board-line">
              <div class="rank-column" aria-hidden="true">${rankLabels}</div>
              <div class="board-grid">${squares}</div>
              <div class="rank-column" aria-hidden="true">${rankLabels}</div>
            </div>
            <div class="file-row" aria-hidden="true">${fileLabels}</div>
          </div>
          <figcaption class="board-caption">
            <div class="fen-readout mono">
              <strong>Exact array / FEN-style layout</strong>
              ${FEN}
              <span class="formation-note">The rook occupies the former queen slot (compact c-file after edge-file removal); no edge rooks remain.</span>
            </div>
            <dl class="inventory" aria-label="Piece inventory per side">
              <div><dt>King</dt><dd>1 / side</dd></div>
              <div><dt>Queen</dt><dd>0 / side</dd></div>
              <div><dt>Rook</dt><dd>1 / side</dd></div>
              <div><dt>Bishops</dt><dd>2 / side</dd></div>
              <div><dt>Knights</dt><dd>2 / side</dd></div>
              <div><dt>Pawns</dt><dd>6 / side</dd></div>
            </dl>
          </figcaption>
        </figure>
      `;
    }

    function variantA() {
      const stages = STAGES.map((stage, index) => `
        <article class="stage-card">
          <span class="stage-number">Stage ${index + 1}</span>
          <strong>${stage}</strong>
          <small>${index === 0 ? "new compact opening" : "existing ordered geometry"}</small>
        </article>
      `).join("");

      return `
        <div class="a-shell">
          <header class="a-header">
            <div>
              <div class="eyebrow">Concept A · Minimal appended goal</div>
              <h1>Add one option. Touch nothing else.</h1>
            </div>
            <p>The smallest product change: a plainly named sibling beneath the existing Ordered Progressive goal.</p>
          </header>

          <section class="a-workspace" aria-label="Goal setting and initial board">
            <div class="settings-panel">
              <div class="settings-head">
                <h2>Goal</h2>
                <p>Legacy choices retain their current names and numeric slots.</p>
              </div>
              <div class="goal-option">
                <span class="radio" aria-hidden="true"></span>
                <div>
                  <strong>Ordered Progressive</strong>
                  <small>Current behavior and starting geometry remain unchanged.</small>
                  <small class="mono">OrderedProgressive = 1</small>
                </div>
                <span class="ordinal">legacy</span>
              </div>
              <div class="goal-option selected">
                <span class="radio" aria-hidden="true"></span>
                <div>
                  <strong>Ordered Progressive (6×8 start)</strong>
                  <small>Begins compact, then joins the current ordered geometry ladder.</small>
                  <small class="mono">OrderedProgressive6x8 = 4</small>
                </div>
                <span class="ordinal">new #4</span>
              </div>
              <div class="settings-note">
                <strong>Initial-stage explanation:</strong> remove the orthodox edge rooks, then replace the queen with one rook. On the compact coordinates, that rook appears on c1/c8.
              </div>
            </div>

            <div class="a-board-wrap">
              ${boardMarkup()}
            </div>
          </section>

          <section class="stage-section">
            <div class="eyebrow">Likely ordered sequence</div>
            <h2>Insert 6×8 before the current contract stages</h2>
            <div class="stage-strip">${stages}</div>
          </section>

          <section class="risk-section">
            <div class="eyebrow">Open design risks</div>
            <div class="risk-grid">
              <article class="risk-card">
                <strong>Ordinal compatibility is a contract</strong>
                <p>Slot data casts the goal number directly. Append value 4; never renumber Single=0, OrderedProgressive=1, Progressive=2, or Super=3.</p>
              </article>
              <article class="risk-card">
                <strong>6×8 is not a recognized generation stage yet</strong>
                <p>The current geometry contract and client stage lists begin at 8×8. Generation, unlock logic, locations, projection, and a registered game profile all need an explicit answer before implementation.</p>
              </article>
            </div>
          </section>
        </div>
      `;
    }

    function variantB() {
      const stages = STAGES.map((stage, index) => `
        <li>
          <strong>${stage}</strong>
          <span>${index === 0 ? "trial baseline" : "existing stage"}</span>
        </li>
      `).join("");

      return `
        <div class="b-shell">
          <header class="b-topbar">
            <div class="prototype-flag">Prototype · Experiment 04</div>
            <div class="b-control" aria-label="Control and trial goals">
              <span>Control: Ordered Progressive · #1</span>
              <span class="active">Trial: Experimental · #4</span>
            </div>
          </header>

          <section class="b-hero">
            <h1>Compact<br><em>opening.</em><br>Full climb.</h1>
            <div class="b-hypothesis">
              <strong>Hypothesis</strong>
              <p>A visibly smaller first battlefield makes the earliest material progression legible, without redefining the existing Ordered Progressive experience.</p>
            </div>
          </section>

          <section class="lab-grid">
            <div class="lab-board">${boardMarkup()}</div>
            <aside class="lab-readouts">
              <div class="readout">
                <div class="readout-label"><span>Proposed goal</span><span>Append only</span></div>
                <div class="readout-value">ExperimentalOrderedProgressive = 4</div>
              </div>
              <div class="readout">
                <div class="readout-label"><span>Trial name</span><span>Explicitly provisional</span></div>
                <div class="readout-value">Experimental Compact Progression</div>
              </div>
              <div class="readout">
                <div class="readout-label"><span>Array</span><span>6 files · 8 ranks</span></div>
                <div class="readout-value">${FEN}</div>
              </div>
              <div class="control-group">
                <span class="control-tag">Control</span>
                <div>
                  <strong class="mono">OrderedProgressive = 1</strong>
                  <small>Preserved and selectable for direct A/B comparison.</small>
                </div>
              </div>
              <h2 class="b-stage-title">Ordered trial run</h2>
              <ol class="stage-ladder">${stages}</ol>
            </aside>
          </section>

          <section class="b-risks">
            <h2>Stop conditions</h2>
            <div class="risk-log">
              <article>
                <strong>Numeric slot drift</strong>
                <p>Reject any implementation that inserts the experiment before value 4. Existing goal ordinals are serialized input.</p>
              </article>
              <article>
                <strong>Generation blind spot</strong>
                <p>Do not imply support until the generation side recognizes 6×8 and publishes its unlock/location expectations. Current non-Single client logic shares later-stage handling.</p>
              </article>
            </div>
          </section>
        </div>
      `;
    }

    function variantC() {
      const stages = STAGES.map((stage, index) => `
        <article class="journey-node ${index === 0 ? "start" : ""}">
          <small>${index === 0 ? "New prologue" : `Current stage ${index}`}</small>
          <strong>${stage}</strong>
        </article>
      `).join("");

      return `
        <div class="c-shell">
          <header class="c-header">
            <div>
              <div class="prototype-flag">Concept C · Migration-ready naming</div>
              <h1>Name the lane, not the square.</h1>
            </div>
            <p>Frame this as the next version of an ordered journey. The 6×8 board is its prologue, not a permanent suffix in the customer-facing name.</p>
          </header>

          <section class="lane-compare" aria-label="Stable and next goal lanes">
            <article class="lane">
              <span class="lane-label">Stable lane · remains selectable</span>
              <span class="ordinal-orb">1</span>
              <h2>Ordered Progressive</h2>
              <code>OrderedProgressive = 1</code>
              <p>No renamed label, no changed opening, no migration. Existing worlds keep the known goal.</p>
            </article>
            <article class="lane next">
              <span class="lane-label">Next lane · proposed append</span>
              <span class="ordinal-orb">4</span>
              <h2>Ordered Progressive Next</h2>
              <code>OrderedProgressiveV2 = 4</code>
              <p>A versionable contract boundary for the compact prologue and any future stage semantics, while leaving the original lane intact.</p>
            </article>
          </section>

          <section class="journey">
            <div class="journey-head">
              <h2>One new prologue, then the known road</h2>
              <p>Likely stage order · requires generation contract confirmation</p>
            </div>
            <div class="journey-map">${stages}</div>
          </section>

          <section class="c-dossier">
            <div class="c-board">${boardMarkup()}</div>
            <div class="dossier-copy">
              <div class="eyebrow">Stage-zero dossier</div>
              <h2>Orthodox silhouette, compressed.</h2>
              <p>Remove both edge rooks from each orthodox back rank and replace the queen with a rook. Each side starts with 12 pieces: 6 pawns, 2 knights, 2 bishops, 1 rook, and 1 king.</p>

              <div class="config-table" aria-label="Proposed state and configuration">
                <div class="config-row">
                  <span>Proposed enum</span>
                  <strong class="mono">OrderedProgressiveV2 = 4</strong>
                </div>
                <div class="config-row">
                  <span>Legacy enum</span>
                  <strong class="mono">OrderedProgressive = 1 · preserved</strong>
                </div>
                <div class="config-row">
                  <span>Initial array</span>
                  <code>${FEN}</code>
                </div>
                <div class="config-row">
                  <span>Stage order</span>
                  <strong>${STAGES.join(" → ")}</strong>
                </div>
              </div>

              <div class="c-risk-list">
                <div class="c-risk">
                  <b>1</b>
                  <div>
                    <strong>Protect serialized ordinals</strong>
                    <p>The direct numeric cast makes append-only enum evolution the safe assumption. Values 0–3 stay fixed.</p>
                  </div>
                </div>
                <div class="c-risk">
                  <b>2</b>
                  <div>
                    <strong>Define 6×8 on both sides of the contract</strong>
                    <p>The current stage order and registered profiles start at 8×8. Generation-side reachability, unlocks, locations, and client projection do not yet promise this prologue.</p>
                  </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      `;
    }

    const VARIANTS = [
      { key: "A", name: "Minimal append", render: variantA },
      { key: "B", name: "Experiment console", render: variantB },
      { key: "C", name: "Migration map", render: variantC }
    ];

    function requestedVariant() {
      const raw = new URLSearchParams(window.location.search).get("variant");
      const key = (raw || "A").toUpperCase();
      return VARIANTS.findIndex(variant => variant.key === key);
    }

    let currentIndex = Math.max(0, requestedVariant());

    function render(index, updateUrl) {
      currentIndex = (index + VARIANTS.length) % VARIANTS.length;
      const variant = VARIANTS[currentIndex];
      const app = document.getElementById("app");
      app.className = `variant variant-${variant.key.toLowerCase()}`;
      app.innerHTML = variant.render();
      document.getElementById("switcher-label").innerHTML =
        `${variant.key} — ${variant.name} <small>· ← →</small>`;
      document.title = `PROTOTYPE ${variant.key} — ${variant.name}`;

      if (updateUrl) {
        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set("variant", variant.key);
        try {
          window.history.replaceState({}, "", nextUrl.href);
        } catch (error) {
          window.location.search = nextUrl.search;
        }
      }

      window.scrollTo({ top: 0, behavior: "auto" });
    }

    document.querySelectorAll("[data-delta]").forEach(button => {
      button.addEventListener("click", () => {
        render(currentIndex + Number(button.dataset.delta), true);
      });
    });

    document.addEventListener("keydown", event => {
      const target = event.target;
      const editing = target.matches("input, textarea, select, [contenteditable='true']");
      if (editing) return;
      if (event.key === "ArrowLeft") render(currentIndex - 1, true);
      if (event.key === "ArrowRight") render(currentIndex + 1, true);
    });

    render(currentIndex, false);
  </script>
</body>
</html>
